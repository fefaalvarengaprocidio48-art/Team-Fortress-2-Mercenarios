<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tam Fortress 2 - Mercenários</title>
<style>

/* =====================================================
   CONFIGURAÇÃO GERAL
===================================================== */

* {

    margin: 0;

    padding: 0;

    box-sizing: border-box;

}


body {

    width: 100vw;

    height: 100vh;

    overflow: hidden;

    background: #111;

    color: white;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

}


/* =====================================================
   TELA PRINCIPAL
===================================================== */

.screen {

    position: relative;

    width: 100vw;

    height: 100vh;

    overflow: hidden;

    background: #111;

}


/* =====================================================
   IMAGEM DE FUNDO
===================================================== */

.background-character {

    position: absolute;

    inset: 0;

    width: 100%;

    height: 100%;

    object-fit: cover;

    object-position: center top;

    transition:

        opacity .5s ease,

        transform .8s ease;

    transform: scale(1.02);

}


/* =====================================================
   SOMBRAS SOBRE A IMAGEM

   Isso é o que vai dar o efeito parecido
   com uma tela cinematográfica.
===================================================== */

.shadow {

    position: absolute;

    inset: 0;

    z-index: 2;

    pointer-events: none;

    background:

        linear-gradient(
            90deg,

            rgba(0,0,0,.95) 0%,

            rgba(0,0,0,.75) 18%,

            rgba(0,0,0,.35) 40%,

            rgba(0,0,0,.08) 65%,

            rgba(0,0,0,.55) 100%
        );

}


/* sombra embaixo */

.shadow-bottom {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 45%;

    z-index: 3;

    pointer-events: none;

    background:

        linear-gradient(
            transparent,
            rgba(0,0,0,.95)
        );

}


/* =====================================================
   MENU LATERAL
===================================================== */

.class-menu {

    position: absolute;

    left: 35px;

    top: 50%;

    transform:
        translateY(-50%);

    z-index: 10;

    display: flex;

    flex-direction: column;

    gap: 12px;

}


/* =====================================================
   ÍCONE DO PERSONAGEM
===================================================== */

.class-button {

    position: relative;

    width: 62px;

    height: 62px;

    border-radius: 50%;

    border:

        2px solid
        rgba(255,255,255,.35);

    background:

        rgba(15,15,15,.65);

    backdrop-filter:
        blur(5px);

    cursor: pointer;

    overflow: hidden;

    transition:

        transform .2s,

        border .2s,

        background .2s,

        box-shadow .2s;

}


/* imagem dentro da bolinha */

.class-button img {

    width: 100%;

    height: 100%;

    object-fit: cover;

}

.class-button:hover {

    transform:
        scale(1.15);

    border-color:
        white;

    background:
        rgba(255, 255, 255, 0.06);

}


/* selecionado */

.class-button.active {

    border:

        3px solid
        #d5a64d;

    box-shadow:

        0 0 20px
        rgba(213,166,77,.7);

    transform:
        scale(1.12);

}


/* =====================================================
   INFORMAÇÕES
===================================================== */

.info {

    position: absolute;

    left: 140px;

    top: 50%;

    transform:
        translateY(-50%);

    width: 480px;

    z-index: 5;

}


/* classe */

.class-type {

    color:
        #ffffff;

    font-size:
        16px;

    font-weight:
        bold;

    letter-spacing:
        5px;

    text-transform:
        uppercase;

    margin-bottom:
        10px;

}


/* nome */

.character-name {

    font-size:
        clamp(60px, 7vw, 110px);

    line-height:
        .85;

    font-weight:
        900;

    letter-spacing:
        3px;

    text-transform:
        uppercase;

    text-shadow:

        4px 5px 0
        rgba(0,0,0,.6);

}


/* subtítulo */

.character-role {

    margin-top:
        15px;

    color:
        #fc5400;

    font-size:
        18px;

    font-weight:
        bold;

    text-transform:
        uppercase;

    letter-spacing:
        2px;

}


/* linha */

.line {

    width:
        350px;

    height:
        2px;

    margin:
        25px 0;

    background:

        linear-gradient(
            90deg,
            #ff5e00,
            transparent
        );

}


/* descrição */

.description {

    color:
        #ffffff;

    font-size:
        16px;

    line-height:
        1.7;

    max-width:
        450px;

}


/* =====================================================
   INFORMAÇÕES INFERIORES
===================================================== */

.stats {

    display:
        flex;

    gap:
        35px;

    margin-top:
        30px;

}


.stat {

    display:
        flex;

    flex-direction:
        column;

}


.stat-title {

    color:
        #999;

    font-size:
        10px;

    letter-spacing:
        2px;

    margin-bottom:
        5px;

}


.stat-value {

    font-size:
        17px;

    font-weight:
        bold;

}


/* =====================================================
   NOME DO SITE
===================================================== */

.logo {

    position:
        absolute;

    left:
        40px;

    top:
        30px;

    z-index:
        20;

    font-size:
        16px;

    font-weight:
        bold;

    letter-spacing:
        4px;

    color:
        #ddd;

}


/* =====================================================
   BOTÃO / INDICAÇÃO
===================================================== */

.select-text {

    position:
        absolute;

    right:
        40px;

    bottom:
        35px;

    z-index:
        10;

    color:
        rgba(255,255,255,.5);

    font-size:
        11px;

    letter-spacing:
        2px;

}


/* =====================================================
   ANIMAÇÃO
===================================================== */

.info.animate {

    animation:
        infoEnter .45s ease;

}


.background-character.animate {

    animation:
        backgroundEnter .7s ease;

}


@keyframes infoEnter {

    from {

        opacity:
            0;

        transform:
            translateY(-50%)
            translateX(-30px);

    }

    to {

        opacity:
            1;

        transform:
            translateY(-50%)
            translateX(0);

    }

}


@keyframes backgroundEnter {

    from {

        opacity:
            .2;

        transform:
            scale(1.08);

    }

    to {

        opacity:
            1;

        transform:
            scale(1.02);

    }

}


/* =====================================================
   CELULAR
===================================================== */

@media(max-width: 800px) {


    .class-menu {

        left:
            15px;

        top:
            40%;

        gap:
            8px;

    }


    .class-button {

        width:
            45px;

        height:
            45px;

    }


    .info {

        left:
            80px;

        right:
            20px;

        width:
            auto;

    }


    .character-name {

        font-size:
            55px;

    }


    .description {

        font-size:
            13px;

    }


    .stats {

        gap:
            15px;

    }


    .shadow {

        background:

            linear-gradient(
                90deg,
                rgba(0,0,0,.9),
                rgba(0,0,0,.45),
                rgba(0,0,0,.5)
            );

    }

}


</style>

const characterSounds = {
    scout: new Audio("sounds/Scout.mp3.mp3"),
    soldier: new Audio("sounds/Soldier.mp3.mp3"),
    pyro: new Audio("sounds/Pyro.mp3.mp3"),
    demoman: new Audio("sounds/Demoman.mp3.mp3"),
    heavy: new Audio("sounds/Heavy.mp3.mp3"),
    engineer: new Audio("sounds/Engineer.mp3.mp3"),
    medic: new Audio("sounds/Medic.mp3.mp3"),
    sniper: new Audio("sounds/Sniper.mp3.mp3"),
    spy: new Audio("sounds/Spy.mp3.mp3")
};

let currentSound = null;

function playCharacterSound(id) {

    const sound = characterSounds[id];

    if (!sound) {
        return;
    }

    if (currentSound) {
        currentSound.pause();
        currentSound.currentTime = 0;
    }

    currentSound = sound;
    sound.currentTime = 0;
    sound.play().catch(() => {});

}



/* =====================================================
   ELEMENTOS
===================================================== */

const buttons =
    document.querySelectorAll(
        ".class-button"
    );


const background =
    document.getElementById(
        "backgroundCharacter"
    );


const info =
    document.getElementById(
        "info"
    );


const classType =
    document.getElementById(
        "classType"
    );


const characterName =
    document.getElementById(
        "characterName"
    );


const characterRole =
    document.getElementById(
        "characterRole"
    );


const description =
    document.getElementById(
        "description"
    );


const health =
    document.getElementById(
        "health"
    );


const speed =
    document.getElementById(
        "speed"
    );


const weapon =
    document.getElementById(
        "weapon"
    );



/* =====================================================
   SELECIONAR PERSONAGEM
===================================================== */

function selectCharacter(id) {


    const character =
        characters[id];


    if (!character) {

        return;

    }


    /* imagem */

    background.style.opacity = "0";


    setTimeout(() => {

        background.src =
            character.image;

        background.alt =
            character.name;

        background.style.opacity = "1";

    }, 150);



    /* informações */

    classType.textContent =
        character.type;


    characterName.textContent =
        character.name;


    characterRole.textContent =
        character.role;


    description.textContent =
        character.description;


    health.textContent =
        character.health;


    speed.textContent =
        character.speed;


    weapon.textContent =
        character.weapon;



    /* botão ativo */

    buttons.forEach(
        button => {

            button.classList.remove(
                "active"
            );

        }
    );


    const selected =
        document.querySelector(
            `[data-character="${id}"]`
        );


    if (selected) {

        selected.classList.add(
            "active"
        );

    }



    /* animação */

    info.classList.remove(
        "animate"
    );

    background.classList.remove(
        "animate"
    );


    void info.offsetWidth;


    info.classList.add(
        "animate"
    );

    background.classList.add(
        "animate"
    );

}



/* =====================================================
   MOUSE
===================================================== */

buttons.forEach(
    button => {


        button.addEventListener(
            "mouseenter",
            () => {

                selectCharacter(
                    button.dataset.character
                );

                playCharacterSound(
                    button.dataset.character
                );

            }
        );


        button.addEventListener(
            "click",
            () => {

                selectCharacter(
                    button.dataset.character
                );

            }
        );


    }
);
